name: Build Edith APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - name: Write Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.edith.home",
            "appName": "Edith",
            "webDir": "www",
            "server": { "androidScheme": "http", "cleartext": true },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          grep -q usesCleartextTraffic android/app/src/main/AndroidManifest.xml || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: edith-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
